name: Flutter CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.1'
  NODE_VERSION: '20'
  NDK_VERSION: '29.0.13113456'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Cache Flutter dependencies
      - name: Cache Flutter packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            build/
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # ✅ Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # ✅ Install Android SDK (FIX)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Accept licenses + install required SDK parts
      - name: Install Android dependencies
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      # ✅ Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      # ✅ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ✅ Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ✅ Decode keystore
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.keystore

          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=$(pwd)/my-release-key.keystore" >> android/key.properties

          ls -l android/
          cat android/key.properties

      # ✅ Create .env
      - name: Create .env file
        run: echo "${{ secrets.MY_ENV_FILE }}" > .env

      # ✅ Build APK
      - name: Build APK
        run: flutter build apk --release

      # ✅ Upload artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      # ✅ Deploy to Firebase
      - name: Deploy to Firebase App Distribution
        if: github.ref == 'refs/heads/master'
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          echo "$FIREBASE_CREDENTIALS" > firebase_credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/firebase_credentials.json"

          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "1:759335379864:android:6bed5dad18690c487401ed" \
            --groups "Team" \
            --release-notes "🚀 New release from GitHub CI/CD"